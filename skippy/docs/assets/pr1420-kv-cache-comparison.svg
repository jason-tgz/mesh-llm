<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" aria-labelledby="title desc" role="img" viewBox="0 0 1600 1280"><title id="title">Production KV cache comparison between the old and new schedulers</title><desc id="desc">The upper grouped bar chart shows cache-derived time-to-first-token savings for three ResidentKv model families. The lower diverging bar chart shows the warm time-to-first-token change for three recurrent model families at concurrency one and four. ResidentKv improves strongly. Recurrent cache reuse is exact on both schedulers, with single-request overhead and concurrent improvements on the new scheduler.</desc><style>:root{color-scheme:light dark}.bg{fill:#fff}.fg{fill:#111827}.muted{fill:#4b5563}.grid{stroke:#d1d5db}.frame{stroke:#9ca3af}.baseline{stroke:#111827}.title{font:600 38px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.subtitle{font:400 22px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.label{font:600 25px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.small{font:400 20px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.axis{font:400 18px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.value{font:600 18px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}@media (prefers-color-scheme:dark){.bg{fill:#0b1020}.fg{fill:#f3f4f6}.muted{fill:#cbd5e1}.grid{stroke:#334155}.frame{stroke:#64748b}.baseline{stroke:#f3f4f6}}</style><rect width="1600" height="1280" class="bg"/><text x="70" y="62" class="title fg">Production KV cache A/B: cache type matters</text><text x="70" y="100" class="subtitle muted">OLD 03cbe8d7 vs NEW 8d658602 · two alternating-order replicates · 20–24 measured requests per cell</text><rect width="24" height="24" x="70" y="126" fill="#94a3b8" rx="3"/><text x="106" y="146" class="small fg">OLD</text><rect width="24" height="24" x="190" y="126" fill="#2563eb" rx="3"/><text x="226" y="146" class="small fg">NEW</text><text x="120" y="218" class="label fg">ResidentKv: cache-derived p50 TTFT savings at N=1</text><text x="1510" y="218" class="small muted" text-anchor="end">Cold p50 − warm-hit p50 · more saved is better</text><line x1="150" x2="1510" y1="620" y2="620" class="grid"/><line x1="150" x2="1510" y1="532.5" y2="532.5" class="grid"/><line x1="150" x2="1510" y1="445" y2="445" class="grid"/><line x1="150" x2="1510" y1="357.5" y2="357.5" class="grid"/><line x1="150" x2="1510" y1="270" y2="270" class="grid"/><text x="132" y="626" class="axis muted" text-anchor="end">0</text><text x="132" y="538.5" class="axis muted" text-anchor="end">750</text><text x="132" y="451" class="axis muted" text-anchor="end">1,500</text><text x="132" y="363.5" class="axis muted" text-anchor="end">2,250</text><text x="132" y="276" class="axis muted" text-anchor="end">3,000</text><rect width="1360" height="350" x="150" y="270" fill="none" class="frame"/><text class="small fg" text-anchor="middle" transform="translate(35 445) rotate(-90)">p50 TTFT saved (ms)</text><rect width="110" height="42.8" x="245" y="577.2" fill="#94a3b8" rx="4"><title>Llama OLD cache lift: 367 ms</title></rect><rect width="110" height="83.2" x="373" y="536.8" fill="#2563eb" rx="4"><title>Llama NEW cache lift: 713 ms</title></rect><text x="300" y="568" class="value fg" text-anchor="middle">367</text><text x="428" y="527" class="value fg" text-anchor="middle">713</text><text x="364" y="657" class="small fg" text-anchor="middle">Llama · dense GQA</text><rect width="110" height="66.6" x="665" y="553.4" fill="#94a3b8" rx="4"><title>Gemma2 OLD cache lift: 571 ms</title></rect><rect width="110" height="171.3" x="793" y="448.7" fill="#2563eb" rx="4"><title>Gemma2 NEW cache lift: 1468 ms</title></rect><text x="720" y="544" class="value fg" text-anchor="middle">571</text><text x="848" y="439" class="value fg" text-anchor="middle">1,468</text><text x="784" y="657" class="small fg" text-anchor="middle">Gemma2 · SWA</text><rect width="110" height="131.6" x="1085" y="488.4" fill="#94a3b8" rx="4"><title>DeepSeek MLA OLD cache lift: 1128 ms</title></rect><rect width="110" height="328.1" x="1213" y="291.9" fill="#2563eb" rx="4"><title>DeepSeek MLA NEW cache lift: 2812 ms</title></rect><text x="1140" y="479" class="value fg" text-anchor="middle">1,128</text><text x="1268" y="282" class="value fg" text-anchor="middle">2,812</text><text x="1204" y="657" class="small fg" text-anchor="middle">DeepSeek2 · MLA</text><rect width="24" height="24" x="70" y="698" fill="#f97316" rx="3"/><text x="106" y="718" class="small fg">N=1</text><rect width="24" height="24" x="190" y="698" fill="#16a34a" rx="3"/><text x="226" y="718" class="small fg">N=4</text><text x="120" y="765" class="label fg">KvRecurrent: warm p50 TTFT change on NEW</text><text x="1510" y="765" class="small muted" text-anchor="end">Negative is faster · both schedulers restore the exact prefix with zero re-prefill</text><line x1="150" x2="1510" y1="800" y2="800" class="grid"/><line x1="150" x2="1510" y1="885" y2="885" class="grid"/><line x1="150" x2="1510" y1="970" y2="970" stroke-width="2" class="baseline"/><line x1="150" x2="1510" y1="1055" y2="1055" class="grid"/><line x1="150" x2="1510" y1="1140" y2="1140" class="grid"/><text x="132" y="806" class="axis muted" text-anchor="end">+40%</text><text x="132" y="891" class="axis muted" text-anchor="end">+20%</text><text x="132" y="976" class="axis muted" text-anchor="end">0%</text><text x="132" y="1061" class="axis muted" text-anchor="end">−20%</text><text x="132" y="1146" class="axis muted" text-anchor="end">−40%</text><rect width="1360" height="340" x="150" y="800" fill="none" class="frame"/><text class="small fg" text-anchor="middle" transform="translate(35 970) rotate(-90)">NEW vs OLD warm TTFT</text><rect width="110" height="20.8" x="245" y="949.2" fill="#f97316" rx="4"><title>Qwen3.5 N=1: 4.9% slower</title></rect><rect width="110" height="94.3" x="373" y="970" fill="#16a34a" rx="4"><title>Qwen3.5 N=4: 22.2% faster</title></rect><text x="300" y="940" class="value fg" text-anchor="middle">+4.9%</text><text x="428" y="1085" class="value fg" text-anchor="middle">−22.2%</text><text x="364" y="1180" class="small fg" text-anchor="middle">Qwen3.5 · hybrid</text><rect width="110" height="12.9" x="665" y="957.1" fill="#f97316" rx="4"><title>Falcon-H1 N=1: 3.0% slower</title></rect><rect width="110" height="125.4" x="793" y="970" fill="#16a34a" rx="4"><title>Falcon-H1 N=4: 29.5% faster</title></rect><text x="720" y="948" class="value fg" text-anchor="middle">+3.0%</text><text x="848" y="1116" class="value fg" text-anchor="middle">−29.5%</text><text x="784" y="1180" class="small fg" text-anchor="middle">Falcon-H1 · SSM</text><rect width="110" height="136.4" x="1085" y="833.6" fill="#f97316" rx="4"><title>Qwen3-Next N=1: 32.1% slower</title></rect><rect width="110" height="95.6" x="1213" y="970" fill="#16a34a" rx="4"><title>Qwen3-Next N=4: 22.5% faster</title></rect><text x="1140" y="824" class="value fg" text-anchor="middle">+32.1%</text><text x="1268" y="1086" class="value fg" text-anchor="middle">−22.5%</text><text x="1204" y="1180" class="small fg" text-anchor="middle">Qwen3-Next · linear</text><text x="70" y="1230" class="small fg">ResidentKv conclusion: NEW retains the full reusable prefix; OLD re-prefills 230–233 tokens.</text><text x="70" y="1262" class="axis muted">KvRecurrent conclusion: exact state reuse is preserved; NEW trades N=1 overhead for lower warm latency at N=4.</text></svg>