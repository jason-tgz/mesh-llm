<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" aria-labelledby="title desc" role="img" viewBox="0 0 1000 500"><title id="title">Resident KV serial time to first token, cold versus warm</title><desc id="desc">For Llama GQA on Metal at concurrency one, warm p50 time to first token fell from 1536.3 to 27.7 milliseconds for exact replay, from 1399.9 to 72.7 milliseconds for a divergent tail, and from 1540.9 to 82.1 milliseconds for a growing coding trace.</desc><metadata>Source: /private/tmp/pr1429-studio54-final/llama-gqa/comparison.json; NEW commit 70d3777693f7a944a007637d8ba2936aac1a7ef5; two rounds; 20 requests per cell.</metadata><style>text{fill:#24292f;font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.title{font-size:22px;font-weight:600}.legend,.note,.subtitle,.tick{font-size:13px}.label{font-size:15px;font-weight:600}.value,.value-inbar{font-size:13px;font-weight:600}.value-inbar{fill:#fff}.axis,.grid{stroke:#d0d7de;stroke-width:1}.cold{fill:#8c959f}.warm{fill:#1f883d}@media (prefers-color-scheme:dark){text{fill:#f0f6fc}.axis,.grid{stroke:#30363d}.cold{fill:#8b949e}.warm{fill:#3fb950}}</style><text x="500" y="34" class="title" text-anchor="middle">Resident KV warm reuse cuts serial TTFT</text><text x="500" y="58" class="subtitle" text-anchor="middle">Llama GQA · Metal · concurrency 1 · p50 milliseconds · lower is better</text><rect width="16" height="12" x="390" y="78" class="cold" rx="2"/><text x="414" y="89" class="legend">Cold</text><rect width="16" height="12" x="470" y="78" class="warm" rx="2"/><text x="494" y="89" class="legend">Warm</text><line x1="220" x2="220" y1="110" y2="420" class="grid"/><line x1="370" x2="370" y1="110" y2="420" class="grid"/><line x1="520" x2="520" y1="110" y2="420" class="grid"/><line x1="670" x2="670" y1="110" y2="420" class="grid"/><line x1="820" x2="820" y1="110" y2="420" class="grid"/><text x="220" y="442" class="tick" text-anchor="middle">0</text><text x="370" y="442" class="tick" text-anchor="middle">400</text><text x="520" y="442" class="tick" text-anchor="middle">800</text><text x="670" y="442" class="tick" text-anchor="middle">1,200</text><text x="820" y="442" class="tick" text-anchor="middle">1,600 ms</text><line x1="220" x2="820" y1="420" y2="420" class="axis"/><text x="200" y="154" class="label" text-anchor="end">Exact replay</text><rect width="576" height="22" x="220" y="128" class="cold" rx="3"/><text x="788" y="144" class="value-inbar" text-anchor="end">1,536.3</text><rect width="10" height="22" x="220" y="160" class="warm" rx="3"/><text x="238" y="176" class="value">27.7 ms · 55.5× faster</text><text x="200" y="264" class="label" text-anchor="end">Divergent tail</text><rect width="525" height="22" x="220" y="238" class="cold" rx="3"/><text x="737" y="254" class="value-inbar" text-anchor="end">1,399.9</text><rect width="27" height="22" x="220" y="270" class="warm" rx="3"/><text x="255" y="286" class="value">72.7 ms · 19.3× faster</text><text x="200" y="374" class="label" text-anchor="end">Growing coding trace</text><rect width="578" height="22" x="220" y="348" class="cold" rx="3"/><text x="790" y="364" class="value-inbar" text-anchor="end">1,540.9</text><rect width="31" height="22" x="220" y="380" class="warm" rx="3"/><text x="259" y="396" class="value">82.1 ms · 18.8× faster</text><text x="500" y="478" class="note" text-anchor="middle">Llama GQA Metal · two rounds · 20 requests/cell · NEW cold versus NEW warm</text></svg>