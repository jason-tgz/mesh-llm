<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" aria-labelledby="title desc" role="img" viewBox="0 0 1600 1600"><title id="title">Old to new scheduler comparison across seven architecture and strategy workloads</title><desc id="desc">Two line charts compare new scheduler throughput and end-to-end p99 latency as ratios to the old scheduler across concurrency one to sixty-four. Six generation families improve broadly; the native MTP lifecycle fixture is exact but shows control-path overhead.</desc><style>:root{color-scheme:light dark}.bg{fill:#fff}.fg{fill:#111827}.muted{fill:#4b5563}.grid{stroke:#d1d5db}.frame{stroke:#9ca3af}.baseline{stroke:#111827}.label{font:500 25px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.small{font:400 20px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.title{font:500 38px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.subtitle{font:400 22px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.axis{font:400 18px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.line{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.point{stroke:#fff;stroke-width:2}@media (prefers-color-scheme:dark){.bg{fill:#0b1020}.fg{fill:#f3f4f6}.muted{fill:#cbd5e1}.grid{stroke:#334155}.frame{stroke:#64748b}.baseline{stroke:#f3f4f6}.point{stroke:#0b1020}}</style><rect width="1600" height="1600" class="bg"/><text id="title-text" x="70" y="62" class="title fg">Old → new scheduler: family-wide change</text><text x="70" y="100" class="subtitle muted">Six generation families + native MTP verification · old and new serving paths</text><line x1="70" x2="104" y1="145" y2="145" stroke="#2563eb" stroke-linecap="round" stroke-width="5"/><text x="114" y="152" class="small fg">Llama 3.2</text><line x1="315" x2="349" y1="145" y2="145" stroke="