<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" aria-labelledby="title desc" role="img" viewBox="0 0 1000 500"><title id="title">Resident KV serial suffix prefill, old versus unified radix</title><desc id="desc">For Llama GQA on Metal at concurrency one, exact replay required zero suffix tokens on both implementations. The unified radix reduced divergent-tail suffix prefill from 66 to 17 tokens and growing coding-trace suffix prefill from 79 to 46 tokens.</desc><metadata>Source: /private/tmp/pr1429-studio54-final/llama-gqa/comparison.json; OLD commit 3c0f43d4d53361fcdd9eee849824e9392bab522a; NEW commit 70d3777693f7a944a007637d8ba2936aac1a7ef5; two rounds; 20 requests per cell.</metadata><style>text{fill:#24292f;font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.title{font-size:22px;font-weight:600}.legend,.note,.subtitle,.tick{font-size:13px}.label{font-size:15px;font-weight:600}.value,.value-inbar{font-size:13px;font-weight:600}.value-inbar{fill:#fff}.axis,.grid{stroke:#d0d7de;stroke-width:1}.old{fill:#8c959f}.new{fill:#0969da}@media (prefers-color-scheme:dark){text{fill:#f0f6fc}.axis,.grid{stroke:#30363d}.old{fill:#8b949e}.new{fill:#58a6ff}}</style><text x="500" y="34" class="title" text-anchor="middle">Unified radix reduces serial suffix prefill</text><text x="500" y="58" class="subtitle" text-anchor="middle">Llama GQA · warm cache · Metal · concurrency 1 · median tokens · lower is better</text><rect width="16" height="12" x="390" y="78" class="old" rx="2"/><text x="414" y="89" class="legend">OLD flat cache</text><rect width="16" height="12" x="515" y="78" class="new" rx="2"/><text x="539" y="89" class="legend">NEW unified radix</text><line x1="220" x2="220" y1="110" y2="420" class="grid"/><line x1="370" x2="370" y1="110" y2="420" class="grid"/><line x1="520" x2="520" y1="110" y2="420" class="grid"/><line x1="670" x2="670" y1="110" y2="420" class="grid"/><line x1="820" x2="820" y1="110" y2="420" class="grid"/><text x="220" y="442" class="tick" text-anchor="middle">0</text><text x="370" y="442" class="tick" text-anchor="middle">20</text><text x="520" y="442" class="tick" text-anchor="middle">40</text><text x="670" y="442" class="tick" text-anchor="middle">60</text><text x="820" y="442" class="tick" text-anchor="middle">80 tokens</text><line x1="220" x2="820" y1="420" y2="420" class="axis"/><text x="200" y="154" class="label" text-anchor="end">Exact replay</text><rect width="0" height="22" x="220" y="128" class="old"/><text x="228" y="144" class="value">0</text><rect width="0" height="22" x="220" y="160" class="new"/><text x="228" y="176" class="value">0 · unchanged</text><text x="200" y="264" class="label" text-anchor="end">Divergent tail</text><rect width="495" height="22" x="220" y="238" class="old" rx="3"/><text x="707" y="254" class="value-inbar" text-anchor="end">66</text><rect width="128" height="22" x="220" y="270" class="new" rx="3"/><text x="356" y="286" class="value">17 · 74% fewer</text><text x="200" y="374" class="label" text-anchor="end">Growing coding trace</text><rect width="593" height="22" x="220" y="348" class="old" rx="3"/><text x="805" y="364" class="value-inbar" text-anchor="end">79</text><rect width="345" height="22" x="220" y="380" class="new" rx="3"/><text x="573" y="396" class="value">46 · 42% fewer</text><text x="500" y="478" class="note" text-anchor="middle">Llama GQA Metal · two rounds · 20 requests/cell · exact replay stays at zero prefill</text></svg>