<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" aria-labelledby="title desc" role="img" viewBox="0 0 1600 920"><title id="title">PR 1478 fixed and adaptive Mesh throughput versus raw llama.cpp on Thoughtworks agent traces</title><desc id="desc">Two panels plot throughput normalized to raw llama.cpp across offered concurrency one through 256. Fixed Mesh wins 17 of 18 correctness-valid cells. Dense wins all nine, while DeepSeek MoE loses only concurrency one. Falcon H1 is excluded because its continuation parity gate failed.</desc><metadata>Source: artifact-full-cuda-c1-final/summary/thoughtworks.csv; benchmarked runtime source 7f8c6ab187c0ddc0ac06425d61012e0b09152436; PR evidence commit ac4beae4ccb140ba6cd639fb55d0abd9fc362372.</metadata><style>:root{color-scheme:light dark}.bg{fill:#fff}.fg{fill:#111827}.muted{fill:#4b5563}.grid{stroke:#d1d5db}.frame{stroke:#9ca3af}.baseline{stroke:#111827}.title{font:600 39px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.subtitle{font:400 23px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.metric{font:650 27px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.label{font:600 25px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.small{font:400 20px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.axis{font:400 17px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.line{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.point{stroke:#fff;stroke-width:2}.card{fill:#f8fafc;stroke:#e2e8f0}@media (prefers-color-scheme:dark){.bg{fill:#0b1020}.fg{fill:#f3f4f6}.muted{fill:#cbd5e1}.grid{stroke:#334155}.frame{stroke:#64748b}.baseline{stroke:#f3f4f6}.point{stroke:#0b1020}.card{fill:#111827;stroke:#334155}}</style><rect width="1600" height="920" class="bg"/><text id